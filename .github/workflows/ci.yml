name: CI

on:
  push:
    branches: [v2, main]
  pull_request:
    branches: [v2, main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint (non-blocking for now — ~1200 pre-existing warnings/errors to clean up incrementally)
        run: npm run lint
        continue-on-error: true

      - name: Typecheck
        run: npx tsc --noEmit
